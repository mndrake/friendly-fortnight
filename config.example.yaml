# DB2 for i Lineage Analyzer — example configuration.
# Copy to config.yaml and fill in real values. config.yaml is gitignored.

connection:
  # IBM Toolbox for Java (jt400.jar) JDBC.
  host: MYLPAR.EXAMPLE.COM
  # Driver jar path; download jt400 and place it here (drivers/ is gitignored).
  jar: drivers/jt400.jar
  driver_class: com.ibm.as400.access.AS400JDBCDriver
  # jdbc url is templated from host if url is omitted.
  url: null
  user: MYUSER
  # Prefer LINEAGE_DB_PASSWORD env var over storing the password here.
  password: null
  # Extra JDBC properties passed through to the driver.
  properties:
    naming: sql
    errors: full
    prompt: "false"
    # translate binary/CCSID handling is driver-default; source retrieval relies on it.

# Scratch library on the host for command outfiles (DSPPGMREF/DSPDBR/DSPFFD
# must write *somewhere*). Must be pre-created and writable by the connection
# user. QTEMP is per-job, so it is safe to share this value across sessions.
scratch_lib: QTEMP

# How source member text is read:
#   auto (default) - decided by the host capability probe: IFS_READ when
#                    QSYS2.IFS_READ exists on the host, alias otherwise.
#   ifs_read       - QSYS2.IFS_READ over the member's /QSYS.LIB path.
#                    Stateless, creates no objects; requires IBM i 7.3 TR7 /
#                    7.4 or later. IFS_READ reports a failed open as ZERO
#                    ROWS (not an error) — e.g. members of DDS/externally-
#                    described data PFs, or SRCDTA CCSID 65535 — so any
#                    member that comes back empty is automatically retried
#                    via the alias strategy.
#   alias          - CREATE ALIAS in scratch_lib -> SELECT -> DROP ALIAS
#                    for every member. Use on older releases.
source_retrieval: auto

# How much of the estate `lineage extract` pulls from the host:
#   full     (default) - pull every configured library/source file in full:
#                        DSPPGMREF/DSPFFD/DSPDBR *ALL, unscoped SYSCOLUMNS/
#                        SYSPARTITIONSTAT, every source member. Simple and
#                        safe; fine for small-to-medium estates.
#   targeted           - iteratively pull only the backward slice of the
#                        configured output_seeds (plus their transitive
#                        callers) to closure, recorded in the slice_objects
#                        table. Recommended for large estates: on one real
#                        estate a full pull measured SYSCOLUMNS ~893k rows,
#                        SYSPARTITIONSTAT a ~64s full scan, and ~16k source
#                        members across the configured source files —
#                        targeted extraction scopes all three to the slice.
#                        DSPPGMREF *ALL per library remains the one broad
#                        pull either way (it's how writers are found).
#                        Override per run with `lineage extract --scope`.
extraction_scope: full

# Libraries to scan for objects and source. Order is significant only for reporting.
libraries:
  - APPLIB
  - APPLIBSRC

# Source physical files (library/file) to enumerate and retrieve members from.
source_files:
  - library: APPLIBSRC
    file: QCLSRC
  - library: APPLIBSRC
    file: QRPGLESRC
  - library: APPLIBSRC
    file: QDDSSRC

# The output files/tables that users consume — the seeds for backward lineage.
# id is a stable label used across reports.
output_seeds:
  - id: CUST_MONTHLY_RPT
    library: APPLIB
    file: CUSTMTHRPT
  - id: ORDER_EXTRACT
    library: APPLIB
    file: ORDEXT

# Assumed library lists per job / subsystem, used to resolve unqualified
# object references found in source. First match wins; multiple matches are
# flagged as ambiguous.
liblists:
  default:
    - APPLIB
    - QGPL
  BATCHSUB:
    - APPLIB
    - APPLIBWK
    - QGPL

# Local storage locations (relative to repo root).
storage:
  duckdb: data/lineage.duckdb
  parquet_dir: data/parquet
